<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha o Mês - {{ year }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #8e2de2, #4a00e0); /* Mesmo gradiente */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #fff;
        }
        .container {
            max-width: 800px; /* Adapta para caber 3 colunas de meses */
            padding: 40px;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 {
            color: #fff;
            margin-bottom: 40px;
            font-size: 2.5em;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .back-link {
            text-decoration: none;
            color: #fff; /* Cor do texto branca */
            display: inline-flex; /* Para alinhar o ícone e o texto */
            align-items: center;
            margin-bottom: 30px;
            font-size: 1.1em;
            transition: transform 0.2s ease;
        }
        .back-link:hover {
            transform: translateX(-5px); /* Efeito sutil de volta */
            color: #e0e0e0; /* Levemente mais claro no hover */
        }
        .back-link i {
            margin-right: 8px; /* Espaço entre o ícone e o texto */
        }
        .month-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); /* Colunas flexíveis */
            gap: 20px;
            margin-top: 20px;
        }
        .month-item a {
            padding: 20px 0;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            background-color: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            text-decoration: none;
            display: block;
        }
        .month-item a:hover {
            background-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{% url 'atividades:select_year' %}" class="back-link">
            <i class="fas fa-arrow-left"></i> Voltar para Escolha do Ano
        </a>
        <h1>Escolha o Mês para {{ year }}</h1>
        <div class="month-grid">
            {% for month_data in months %}
                <div class="month-item">
                    <a href="{% url 'atividades:calendar_view' year=year month=month_data.id %}" class="btn">
                        {{ month_data.name }}
                    </a>
                </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
