<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha o Ano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Fonte mais moderna */
            background: linear-gradient(to right, #8e2de2, #4a00e0);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #fff; /* Texto branco para contraste */
        }
        .container {
            max-width: 550px; /* Levemente mais largo */
            padding: 40px; /* Mais padding */
            border-radius: 15px; /* Bordas mais arredondadas */
            background-color: rgba(255, 255, 255, 0.15); /* Fundo branco semi-transparente */
            backdrop-filter: blur(10px); /* Efeito de desfoque (vidro embaçado) */
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); /* Sombra mais pronunciada */
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.18); /* Borda sutil */
        }
        h1 {
            color: #fff; /* Título branco */
            margin-bottom: 40px; /* Mais espaço abaixo do título */
            font-size: 2.8em; /* Título maior */
            font-weight: 700; /* Mais negrito */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); /* Sombra no texto */
        }
        .year-list {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px; /* Mais espaço entre os botões */
        }
        .year-list li {
            width: 150px; /* Botões um pouco maiores */
        }
        .year-list a {
            padding: 18px 25px; /* Mais padding nos botões */
            font-size: 1.5em; /* Fonte maior nos botões */
            font-weight: bold;
            border-radius: 10px; /* Bordas mais arredondadas para os botões */
            transition: all 0.3s ease; /* Transição mais suave */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Sombra nos botões */
            background-color: rgba(255, 255, 255, 0.3); /* Botões semi-transparentes */
            border: 1px solid rgba(255, 255, 255, 0.4); /* Borda para os botões */
            color: #fff; /* Texto dos botões branco */
            text-decoration: none; /* Sem sublinhado */
            display: block; /* Para o botão ocupar o espaço total do li */
        }
        .year-list a:hover {
            background-color: rgba(255, 255, 255, 0.5); /* Fundo mais opaco no hover */
            transform: translateY(-5px) scale(1.05); /* Efeito de "pular" e crescer */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4); /* Sombra maior no hover */
            color: #fff; /* Garante que o texto continue branco */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Selecione o Ano</h1>
        <ul class="year-list">
            {% for year in years %}
                <li><a href="{% url 'atividades:select_month' year=year %}" class="btn">{{ year }}</a></li>
            {% endfor %}
        </ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
