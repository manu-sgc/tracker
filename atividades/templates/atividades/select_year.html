<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha o Ano</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        h1 { text-align: center; color: #333; }
        ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; }
        li { margin: 10px; }
        a {
            display: block;
            padding: 15px 25px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            font-size: 1.2em;
            transition: background-color 0.3s ease;
        }
        a:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Escolha o Ano</h1>
        <ul>
            {% for year in years %}
                <li><a href="{% url 'atividades:select_month' year=year %}">{{ year }}</a></li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
